          Pct: 0.002
          Value: 20
        Value: 20
    Spread:
      title: Spread
      type: object
      properties:
        DisplayDecimals:
          title: The number of decimals used for display.
          type: integer
          format: int32
          example: 99
        Pct:
          title: Fee in Percentage.
          type: number
          example: 10
        Rule:
          title: Fee Rule
          allOf:
          - $ref: '#/components/schemas/BaseFeeRule'
        Value:
          title: Fee Value.
          type: number
          example: 10
      additionalProperties: false
      example:
        DisplayDecimals: 4
        Rule:
          Pct: 1E-05
        Value: 0.1
    TicketFee:
      title: Ticket Fee
      type: object
      properties:
        Pct:
          title: Fee in Percentage.
          type: number
          example: 10
        Rule:
          title: Fee Rule
