            Rule:
              Pct: 1E-05
            Value: 0.1
        TrailingCommission:
          Pct: 0.5
          Rule:
            Pct: 0.5
          Value: 410.959
    TradingCost:
      title: Trading Cost.
      type: object
      properties:
        Commissions:
          title: The commission structure for the selected instrument.
          type: array
          items:
            $ref: '#/components/schemas/Commision'
          example:
          - Pct: 0.05
            Rule:
              Currency: USD
              MinCommission: 3
            Value: 6
        ConversionCost:
          title: Currency Conversion Cost
          allOf:
          - $ref: '#/components/schemas/ConversionCost'
        CustodyFee:
