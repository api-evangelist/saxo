          type: number
          example: 10
        InterbankRate:
          title: The interbank rate.
          allOf:
          - $ref: '#/components/schemas/InterbankRate'
        MarkUpRate:
          title: The carrying cost percentage markup on the Interbank rate.
          type: number
          example: 10
      additionalProperties: false
      example:
        FixedRate: 1
        InterbankRate:
          AskRate: 2
          BidRate: 1
          TradeDate: '2022-10-31'
        MarkUpRate: 1.5
