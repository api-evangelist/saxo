          type: integer
          format: int32
          example: 99
        FromPeriodInDays:
          title: Minimum days to hold the option before the Holding fee value applies
          type: integer
          format: int32
          example: 99
        Value:
          title: Holding fee value.
          type: number
          example: 10
      additionalProperties: false
      example:
