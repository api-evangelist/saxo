      example: ExecuteOrder
      x-enum-descriptions:
        ExecuteOrder: On execute order.
        AlgorithmicOrder: On execution of algorithmic order.
        EtoExercise: EtoExercise
        EtoAssign: EtoAssign
        EtoDelivery: EtoDelivery
        EtoExpiry: EtoExpiry
        EtoAll: EtoAll
        SRDRollover: SRD rollover fee
