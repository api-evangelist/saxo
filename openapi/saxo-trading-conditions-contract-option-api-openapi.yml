        RuleType:
          title: Exposure limit rule type.
          allOf:
          - $ref: '#/components/schemas/ExposureLimitRuleType'
        Value:
          title: The exposure value.
          type: number
          example: 10
      additionalProperties: false
      example:
        Identifier: CL
        Level: BaseContractNet
        RuleType: Amount
        Value: 200
    CurrencyConversion:
      type: object
      properties:
        AskRate:
          title: Gets or sets the ask.
          type: number
          example: 10
        BidRate:
          title: Gets or sets the bid.
          type: number
          example: 10
        Markup:
          title: Gets or sets the markup.
          type: number
          example: 10
      additionalProperties: false
      example:
        AskRate: 10
        BidRate: 10
        Markup: 10
    Models.CarryingCost:
