          title: Unique id of the instrument.
          type: integer
          format: int32
        UpperBarrier:
          title: The Upper Barrier. Only used to distinguish Fx Barrier Options.
          type: number
        ValueDate:
          title: The value date. Only used to distinguish FxForwards.
          type: string
          format: date-time
          x-type-name: UtcDateTime
