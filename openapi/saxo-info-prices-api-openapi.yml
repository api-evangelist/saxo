        style: form
        explode: false
        schema:
          title: Lower barrier
          type: number
        example: 10
      - name: OrderAskPrice
        in: query
        description: Order ask price. When specified, a corresponding cost of buying will be calculated for that price; otherwise the current market ask price will be used.
        style: form
