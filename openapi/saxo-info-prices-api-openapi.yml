        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                required:
                - ErrorCode
                - Message
                type: object
                properties:
                  ErrorCode:
                    enum:
                    - InstrumentNotAllowed
                    - InstrumentTypeNotSupportedException
                    - InvalidModelState
                    - InvalidRequest
                    - InvalidUic
                    - UicsInListNotUnique
                    - Unknown
                    - UnsupportedSubscriptionFormat
