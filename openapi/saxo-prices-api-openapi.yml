      operationId: PricesV1RequestMarginImpactOnSubscription
      parameters:
      - name: ContextId
        in: path
        description: Context for the streaming connection.
        required: true
        style: simple
        schema:
          type: string
        example: '20160204125301453'
      - name: ReferenceId
        in: path
        description: Unique id of the subscription.
        required: true
        style: simple
        schema:
          type: string
        example: TP340
