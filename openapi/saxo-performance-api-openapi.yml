components:
  schemas:
    Drawdown:
      title: Drawdown
      type: object
      properties:
        DaysCount:
          title: Days Count
          type: integer
          format: int32
          example: 99
        DepthInPercent:
          title: Depth in Percnt
          type: number
          example: 10
        FromDate:
          title: From Date
          type: string
          format: date
          x-type-name: Date
        RecoveryDaysCount:
          title: Recovery Days Count
          type: integer
          format: int32
          example: 99
        ThruDate:
          title: Thru Date
          type: string
          format: date
          x-type-name: Date
      additionalProperties: false
      example:
        DaysCount: 3
        DepthInPercent: 1
        FromDate: '2016-08-05'
        ThruDate: '2016-08-08'
    Contracts.TimeValuePair:
      title: Implementation of a time and value pair.
      type: object
      properties:
        Date:
          title: Date and time of the occurrence.
          type: string
          format: date
          x-type-name: Date
        Value:
          title: The value at the given date and time
          type: number
          example: 10
      additionalProperties: false
      example:
        Date: '0001-01-01'
        Value: 10
    TradesPerDayItem:
      title: Defines a data contract for closed trades count on a single day.
      type: object
      properties:
        Date:
          title: The date.
          type: string
          format: date
          x-type-name: Date
        TradeCount:
          title: The trade count.
          type: integer
          format: int32
          example: 99
      additionalProperties: false
      example:
        Date: '0001-01-01'
        TradeCount: 99
    Contracts.BenchMark:
      title: Benchmark and all
      type: object
      properties:
        Allocations:
          title: List of Benchmark Compositions.
          type: array
          items:
            $ref: '#/components/schemas/InstrumentAllocation'
          example:
          - AllocationPCT: 10
            AssetType: SrdOnStock
            Description: stringValue
            DisplayHintType: Rights
            Uic: 99
        CurrencyCode:
          title: Benchmark currency.
          type: string
          example: stringValue
        Description:
          title: Benchmark description.
          type: string
          example: stringValue
        Name:
          title: Benchmark name.
          type: string
