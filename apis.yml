- aid: saxo:saxo-info-prices-api
  name: Saxo Bank Info Prices API
  description: "Provides end points for polling and subscribing to Info prices. Info prices are primarily\
    \ intended to serve application scenarios, where the user is anonymous, or where an application\n\
    \            wants to setup a pricelist/watchlist, but does not need the ability to let the user trade\
    \ directly on the price shown.\n            Compared to \"Prices\":\n            \n\n*   An InfoPrice\
    \ is not tradable.\n*   An InfoPrice contains fewer field groups.\n*   A single Infoprice subscription\
    \ can return a list of InfoPrices for different instruments.\n*   To setup an Infoprice subscription,\
    \ you must supply much less information. Where possible, appropriate default values will be assumed."
  humanURL: https://www.developer.saxo/openapi/learn
