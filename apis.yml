- aid: saxo:saxo-netpositions-api
  name: Saxo Bank NetPositions API
  description: "Read only end points serving net positions and the positions making up the net position.\n\
    \            The set of net positions is restricted by the supplied query parameters as well as whether\
    \ or not the identity \n            represented by the authorization token has access to the account\
    \ on which the positions are posted.\n\n*   A user of a client will have access to accounts under\
    \ that client\n*   A user of an IB or WLC will have access to accounts on that client or clients there\
    \ under \n*   An employee has access to all accounts\n*   A request containing a TradingFloor \"Federated\
    \ Access\" token will have access to the account specified in that token.\n*   If access is granted\
    \ on the basis of the TradingFloor \"Federated Access\" token, then the number of fields will be a\
    \ subset \n                of the full set of fields shown in the specification for the response."
