    \ WLC will have access to accounts on that client or clients there under \n*   An employee has access\
    \ to all accounts\n*   A request containing a TradingFloor \"Federated Access\" token will have access\
    \ to the account specified in that token.\n*   If access is granted on the basis of the TradingFloor\
    \ \"Federated Access\" token, then the number of fields will be a subset \n                of the\
    \ full set of fields shown in the specification for the response."
